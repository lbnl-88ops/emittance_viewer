name: Release executable
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  windows_build:
    name: Windows Build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: Set up python
        uses: actions/setup-python@v5 
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with windows-build
      - name: Install NSIS
        run: choco install nsis --yes
      - name: Build executable
        run: poetry run pyinstaller --noconsole --name emittance_viewer --onedir app.py
      - name: Build installer
        run: |
          # NSIS is usually in C:\Program Files (x86)\NSIS\
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisPath) {
            & $nsisPath installer.nsi
          } else {
            # Fallback to path if choco added it correctly
            makensis installer.nsi
          }
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ./Emittance_Viewer_Installer.exe
          prerelease: ${{ github.ref_name == 'main' && 'false' || 'true'}}
