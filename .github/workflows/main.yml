name: Release executable
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug_build:
        description: 'Build a --console Debug variant instead of the release --noconsole build (shows tracebacks in a console window; not for distribution).'
        type: boolean
        default: false
jobs:
  windows_build:
    name: Windows Build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
      - name: Set up python
        uses: actions/setup-python@v5 
        with:
          python-version: 3.13
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with windows-build
      - name: Install NSIS
        run: choco install nsis --yes
      - name: Build executable (Debug, --console)
        if: ${{ github.event.inputs.debug_build == 'true' }}
        run: |
          $env:EMITTANCE_VIEWER_DEBUG = "1"
          poetry run pyinstaller emittance_viewer.spec
      - name: Build executable (Release, --noconsole)
        if: ${{ github.event.inputs.debug_build != 'true' }}
        run: poetry run pyinstaller emittance_viewer.spec
      - name: Upload Debug build artifact
        if: ${{ github.event.inputs.debug_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: emittance_viewer-debug-build
          path: dist/emittance_viewer/
      - name: Build installer
        if: ${{ github.event.inputs.debug_build != 'true' }}
        run: |
          # NSIS is usually in C:\Program Files (x86)\NSIS\
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisPath) {
            & $nsisPath installer.nsi
          } else {
            # Fallback to path if choco added it correctly
            makensis installer.nsi
          }
      - name: Create Release
        id: create_release
        if: ${{ github.event.inputs.debug_build != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./Emittance_Viewer_Installer.exe
          prerelease: ${{ github.ref_name == 'main' && 'false' || 'true'}}
